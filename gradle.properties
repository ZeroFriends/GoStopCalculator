# Project-level gradle properties
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Xss256m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

kotlin.native.disablePhases=CastsOptimization
kotlin.native.ignoreDisabledTargets=true
kotlin.daemon.jvmargs=-Xmx6g -Xss256m -Dfile.encoding=UTF-8
kotlin.native.daemon.jvmargs=-Xmx6g -Xss256m -Dfile.encoding=UTF-8
kotlin.native.cache.kind=none
