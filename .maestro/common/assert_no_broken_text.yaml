appId: zero.friends.gostopcalculator
---
# ==========================================
# 공통 가드: 화면에 깨진/미치환 문자열이 노출되지 않는지 검증
# - 각 시나리오의 주요 화면 진입 직후 runFlow 로 호출한다.
# - 언어와 무관하게 동작하므로 다국어 플로우에서도 그대로 재사용한다.
# ==========================================

# 포맷 지정자 미치환(%d/%s/%f), 리소스/데이터 누락(null/undefined/NaN), 리터럴 "\n" 노출 일괄 검증
# 단일 assertNotVisible로 통합해 iOS XCTest viewHierarchy 폴링 부하 및 InputUI teardown 레이스를 줄인다.
- assertNotVisible: "(?s).*(%(\\d+\\$)?[dsf]|\\b(null|undefined|NaN)\\b|\\\\n).*"
