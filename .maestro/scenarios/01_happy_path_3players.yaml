appId: ${APP_ID:-zero.friends.gostopcalculator}
---
# ==========================================
# 시나리오: 3인 고스톱 기본 게임 생성 및 1라운드 점수 계산
# ==========================================

# 1. 앱 실행 (이전 상태 초기화)
- launchApp:
    clearState: true

# 2. 히스토리 메인 화면 진입 확인 및 새 게임 시작
- assertVisible: "시작하기"
- tapOn: "시작하기"

# 3. 플레이어 설정 (3인 추가)
- assertVisible: "플레이어 설정.*"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"

# 플레이어 3명이 등록되면 다음 버튼 활성화됨
- tapOn: "다음"

# 4. 게임 규칙 설정
- assertVisible: "게임규칙.*"
- assertVisible: "완료"
- tapOn: "완료"

# 5. 게임 보드 화면 진입 확인
- assertVisible: "진행내역.*"
- assertVisible: "게임시작"
- tapOn: "게임시작"

# 6. 라운드 준비 (3인 경기 시작)
- assertVisible: "완료"
- tapOn: "완료"

# 7. 승자 선택 (Phase 1)
- assertVisible: "승자 점수기록"
- tapOn: "플레이어 1"
- tapOn: "다음 \\(1/3\\)"

# 8. 점수 기록 (Phase 2 - Scoring)
- assertVisible: "점수기록"
- tapOn: "다음 \\(2/3\\)"

# 9. 패자 점수 기록 (Phase 3 - Loser)
- assertVisible: "패자 점수기록"
- tapOn: "저장"

# 10. 라운드 완료 및 보드 점수 반영 검증
- assertVisible: "진행내역.*"
- assertVisible: "1 라운드"
