appId: zero.friends.gostopcalculator
---
# ==========================================
# 시나리오: 다중 라운드 진행 후 정산내역 및 라운드 상세보기 검증
# ==========================================

- launchApp:
    clearState: true
    stopApp: true

- runFlow: ../common/wait_for_history.yaml
- tapOn: "시작하기"

# 플레이어 3명 추가
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "다음"

# 룰 설정 (점당 100원 입력)
- assertVisible: "게임규칙.*"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn:
    id: "rule_score_input_0"
- inputText: "100"
- tapOn: "게임규칙.*"
- tapOn: "완료"

# [라운드 1] 시작 및 완료
- tapOn: "게임시작"
- tapOn: "플레이어 1"
- tapOn: "플레이어 2"
- tapOn: "플레이어 3"
- tapOn: "완료"
- tapOn: "다음 \\(1/3\\)"
- tapOn:
    id: "winner_point_input_0"
- inputText: "7"
- tapOn: "승자 점수기록"
- tapOn: "다음 \\(2/3\\)"
- tapOn: "다음 \\(3/3\\)"
- tapOn: "완료"
- tapOn: "Back"

# 보드 화면에 1 라운드 표시 확인
- assertVisible: "1 라운드"
- runFlow: ../common/assert_no_broken_text.yaml

# 정산내역 확인
- assertVisible: "정산내역.*"
- tapOn: "정산내역.*"
- assertVisible: "정산내역"
- runFlow: ../common/assert_no_broken_text.yaml
# 회귀 방지: 플레이어 이름이 동일하게 생성되면 정산에서 한 줄로 합쳐지는 버그가 있었음
# ➔ 3명이 각각 별도 행으로 노출되고 승자 금액이 정확한지 검증
- assertVisible: "플레이어 1"
- assertVisible: "플레이어 2"
- assertVisible: "플레이어 3"
- assertVisible: ".*\\+1,400원.*"
- tapOn: "Back"

# 라운드 상세보기 확인
- assertVisible: "상세보기.*"
- tapOn: "상세보기.*"
- assertVisible: "상세보기"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn: "Back"

# 보드 복귀 확인
- assertVisible: "진행내역.*"
