appId: zero.friends.gostopcalculator
---
# ==========================================
# 시나리오: 플레이어 최소 인원 유효성 검사 및 복귀 검증
# ==========================================

- launchApp:
    clearState: true
    stopApp: true

- runFlow: ../common/wait_for_history.yaml
- tapOn: "시작하기"

- assertVisible: "플레이어 설정.*"
- assertVisible: "게임 설정 \\(1/2\\)"

# 1명만 추가 (2명 미만이므로 여전히 다음 비활성화 상태)
- tapOn: "\\+ 플레이어 추가"
- assertVisible: "플레이어 1"

# 2명째 추가 (이제 2인 이상이므로 활성화됨)
- tapOn: "\\+ 플레이어 추가"
- assertVisible: "플레이어 2"
- assertVisible: "다음"

# 3명째 추가
- tapOn: "\\+ 플레이어 추가"
- assertVisible: "플레이어 3"
- assertVisible: "3명"

# 플레이어 1 이름 수정 검증 (NameEditDialog)
- tapOn:
    text: "Edit Player"
    index: 0
- assertVisible: "이름 수정하기"
- eraseText: 10
- inputText: "철수"
- tapOn: "수정하기"
- assertVisible: "철수"
- assertNotVisible: "플레이어 1"

# 첫 번째 플레이어(철수) 삭제 검증 (Android/iOS 동일 인덱스 0 사용)
- tapOn:
    text: "Delete Player"
    index: 0
- assertNotVisible: "철수"
- assertVisible: "2명"
- runFlow: ../common/assert_no_broken_text.yaml

# 규칙 설정(2/2) 진입 및 도움말 다이얼로그·설명서 바로가기 검증 후 히스토리 복귀
- tapOn: "다음"
- assertVisible: "게임규칙.*"
- assertVisible: "게임 설정 \\(2/2\\)"
- tapOn: "도움말"
- assertVisible: "금액 설정 도움말"
- assertVisible: "예: 5점 × 100원 = 500원 \\(예시\\)"
- assertVisible: "삼연뻑 ×4 승리"
- tapOn:
    id: "rule_help_manual_shortcut"
- assertVisible: "고스톱 설명서"
- tapOn: "Back"
- assertVisible: "게임규칙.*"
- assertNotVisible: "금액 설정 도움말"
- tapOn: "도움말"
- tapOn: "확인"
- assertVisible: "게임규칙.*"
- tapOn: "Back"
- tapOn: "Back"
- assertVisible: "시작하기"
