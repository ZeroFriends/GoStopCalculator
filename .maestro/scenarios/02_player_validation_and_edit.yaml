appId: ${APP_ID:-zero.friends.gostopcalculator}
---
# ==========================================
# 시나리오: 플레이어 최소 인원 유효성 검사 및 이름 수정 검증
# ==========================================

- launchApp:
    clearState: true

- assertVisible: "시작하기"
- tapOn: "시작하기"

# 플레이어 미등록 상태에서는 다음 버튼이 비활성화되어 있어야 함
- assertVisible: "플레이어 설정.*"

# 1명만 추가 (2명 미만이므로 여전히 비활성화)
- tapOn: "\\+ 플레이어 추가"

# 2명째 추가 (이제 활성화됨)
- tapOn: "\\+ 플레이어 추가"
- assertVisible: "다음"

# 플레이어 3명으로 추가
- tapOn: "\\+ 플레이어 추가"

# 뒤로가기 버튼 눌러 히스토리로 정상 복귀되는지 확인
- back
- assertVisible: "시작하기"
