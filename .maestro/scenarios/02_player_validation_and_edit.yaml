appId: zero.friends.gostopcalculator
---
# ==========================================
# 시나리오: 플레이어 최소 인원 유효성 검사 및 복귀 검증
# ==========================================

- launchApp:
    clearState: true
    stopApp: true

- extendedWaitUntil:
    visible: "시작하기"
    timeout: 60000
- tapOn: "시작하기"

- assertVisible: "플레이어 설정.*"
- assertVisible: "게임 설정 \\(1/2\\)"

# 1명만 추가 (2명 미만이므로 여전히 다음 비활성화 상태)
- tapOn: "\\+ 플레이어 추가"
- assertVisible: "플레이어 1"

# 2명째 추가 (이제 2인 이상이므로 활성화됨)
- tapOn: "\\+ 플레이어 추가"
- assertVisible: "플레이어 2"
- assertVisible: "다음"

# 3명째 추가
- tapOn: "\\+ 플레이어 추가"
- assertVisible: "플레이어 3"
- runFlow: ../common/assert_no_broken_text.yaml

# 뒤로가기 버튼 눌러 히스토리로 정상 복귀되는지 확인
- tapOn: "Back"
- assertVisible: "시작하기"
