appId: zero.friends.gostopcalculator
---
# ==========================================
# 시나리오: 3인 고박 독박·면제 + 3고 배수 + 확인 모달 '다시 확인' 흐름 검증
# ==========================================

- launchApp:
    clearState: true
    stopApp: true

- runFlow: ../common/wait_for_history.yaml
- tapOn: "시작하기"

# 플레이어 3명 추가
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "다음"

# 룰 설정 (점당 100원)
- assertVisible: "게임규칙.*"
- tapOn:
    id: "rule_score_input_0"
- inputText: "100"
- tapOn: "게임규칙.*"
- tapOn: "완료"

# 판 시작 ➔ 3명 선택
- tapOn: "게임시작"
- tapOn: "플레이어 1"
- tapOn: "플레이어 2"
- tapOn: "플레이어 3"
- tapOn: "완료"

# 점수기록 스킵
- assertVisible: "점수기록"
- tapOn: "다음 \\(1/3\\)"

# 승자 점수기록: 플레이어 1 기본 2점 + 3고 (총 5점 × 100원 × 2배 = 1,000원)
- assertVisible: "승자 점수기록"
- tapOn:
    id: "winner_point_input_0"
- inputText: "2"
- tapOn:
    id: "winner_go_input_0"
- inputText: "3"
- tapOn: "승자 점수기록"
- tapOn: "다음 \\(2/3\\)"

# 패자 점수기록: 플레이어 2 광 박(x2) + 고 박 독박 선택
- assertVisible: "패자 점수기록"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn:
    text: "광 박"
    index: 0
- tapOn:
    text: "고 박"
    index: 0
- assertVisible: ".*광박 \\(x2배\\) · 고박 독박.*"
- assertVisible: "고박 독박: 플레이어 3의 판 점수까지 전액 대신 지불합니다."
- scrollUntilVisible:
    element: "고박 면제 \\(0원 · 플레이어 2 대납\\)"
    direction: DOWN
- tapOn: "다음 \\(3/3\\)"

# 계산 확인 모달 ➔ 고·고박 독박·면제 요약 확인 ➔ '다시 확인' 복귀 후 최종 확정
- assertVisible: "라운드 점수를 확정할까요\\?"
- assertVisible: "3고 \\(\\+3점, x2배\\)"
- assertVisible: "고박 독박 \\(전액 대납\\)"
- assertVisible: "고박 면제 \\(0원\\)"
- tapOn: "다시 확인"
- assertVisible: "패자 점수기록"
- scrollUntilVisible:
    element: ".*광박 \\(x2배\\) · 고박 독박.*"
    direction: UP
- tapOn: "다음 \\(3/3\\)"
- tapOn: "점수 확정하기"

# 상세보기에서 대납/면제 계산 수식 확인 (2,000 + 1,000 = 3,000원)
- assertVisible: "라운드 상세보기"
- assertVisible: "\\+3,000원"
- scrollUntilVisible:
    element: "-3,000원"
    direction: DOWN
- scrollUntilVisible:
    element: ".*플레이어 3 고박 대납.*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*플레이어 2 고박 대납.*"
    direction: DOWN
- runFlow: ../common/assert_no_broken_text.yaml

# 보드 복귀
- tapOn: "Back"
- assertVisible: "1 라운드"
- runFlow: ../common/assert_no_broken_text.yaml
