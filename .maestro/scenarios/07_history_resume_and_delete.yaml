appId: zero.friends.gostopcalculator
---
# ==========================================
# 시나리오: 기존 게임 히스토리 복원(이어하기) 검증
# (참고: 현재 RoundLog UI에 삭제 트리거가 연결되어 있지 않아 복원 흐름만 검증)
# ==========================================

- launchApp:
    clearState: true
    stopApp: true

- extendedWaitUntil:
    visible: "시작하기"
    timeout: 60000
- tapOn: "시작하기"

# 플레이어 3명 추가
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "다음"

# 룰 설정 완료
- tapOn:
    point: "80%,39%"
- inputText: "100"
- tapOn: "게임규칙.*"
- tapOn: "완료"

# 보드 화면 진입 후 1판 진행
- tapOn: "게임시작"
- tapOn: "플레이어 1"
- tapOn: "플레이어 2"
- tapOn: "플레이어 3"
- tapOn: "완료"
- tapOn: "다음 \\(1/3\\)"
- tapOn:
    point: "55%,45%"
- inputText: "7"
- tapOn: "승자 점수기록"
- tapOn: "다음 \\(2/3\\)"
- tapOn: "다음 \\(3/3\\)"
- tapOn: "완료"
- tapOn: "Back"

# 보드에서 뒤로가기 눌러 히스토리 화면으로 복귀
- tapOn: "Back"

# 히스토리 메인에 진행내역 카드 노출 확인
- assertVisible: "진행내역.*"
- assertVisible: "생성일자"
- runFlow: ../common/assert_no_broken_text.yaml

# 기존 게임 카드를 탭하여 다시 보드로 이어하기 복원
- tapOn: "생성일자"

# 보드 화면으로 정상 복귀되었고 이전 라운드 기록이 살아있는지 검증
- assertVisible: "1 라운드"
- runFlow: ../common/assert_no_broken_text.yaml
