appId: ${APP_ID:-zero.friends.gostopcalculator}
---
# ==========================================
# 시나리오: 기존 게임 히스토리 복원(이어하기) 및 게임 삭제 검증
# ==========================================

- launchApp:
    clearState: true

- tapOn: "시작하기"

# 플레이어 3명 추가
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "다음"

# 룰 설정 완료
- tapOn: "완료"

# 보드 화면 진입 후 1판 진행
- tapOn: "게임시작"
- tapOn: "완료"
- tapOn: "플레이어 1"
- tapOn: "다음 \\(1/3\\)"
- tapOn: "다음 \\(2/3\\)"
- tapOn: "저장"

# 보드에서 뒤로가기 눌러 히스토리 화면으로 복귀
- back

# 히스토리 메인에 진행내역 또는 방금 생성된 게임 카드가 노출되는지 확인
- assertVisible: "진행내역.*"
- assertVisible: "플레이중"

# 해당 게임 카드를 탭하여 다시 보드로 이어하기 복원
- tapOn: "플레이중"

# 보드 화면으로 정상 복귀되었고 이전 라운드 기록이 살아있는지 검증
- assertVisible: "1 라운드"
