appId: zero.friends.gostopcalculator
---
# ==========================================
# 시나리오: 통합 고스톱 설명서(홈·보드·점수기록) & 5개 탭·월별 패 검증
# ==========================================

- launchApp:
    clearState: true
    stopApp: true

- runFlow: ../common/wait_for_history.yaml

# 1. 히스토리 상단 Guide 버튼 클릭 시 이용 가이드 다이얼로그 노출 및 페이지 전환/닫기 검증
- tapOn: "Guide"
- assertVisible: "다음"
- assertVisible: "Close"
- tapOn: "다음"
- assertVisible: "Back"
- tapOn: "Close"
- assertVisible: "시작하기"

# 2. 홈 상단 "고스톱 룰" 버튼으로 5개 탭 통합 설명서 진입 및 광팔이 바로가기·월별 패 필터 확인
- tapOn:
    id: "history_manual_button"
- assertVisible: "고스톱 설명서"
- assertVisible: "인원별 세팅 한눈에"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn:
    id: "manual_selling_shortcut"
- assertVisible: "광 \\(5장\\)"
- tapOn:
    id: "manual_filter_all"
- assertVisible: "1월 · 송학"
- scrollUntilVisible:
    element: "9월 · 국진"
    direction: DOWN
    timeout: 15000
- assertVisible: "9월 · 국진"
- tapOn:
    id: "manual_filter_selling"
- assertVisible: "광 \\(5장\\)"
- tapOn: "Back"
- assertVisible: "시작하기"

- tapOn: "시작하기"

# 3. 플레이어 3명 추가
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "다음"

# 4. 룰 설정 (점당 100원 입력)
- assertVisible: "게임규칙.*"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn:
    id: "rule_score_input_0"
- inputText: "100"
- tapOn: "게임규칙.*"
- tapOn: "완료"

# 5. 보드 진입 ➔ "룰·화투패" 진입점(족보·점수 탭 기본 오픈) 확인
- tapOn:
    id: "board_manual_button"
- assertVisible: "고스톱 설명서"
- assertVisible: "5광"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn: "Back"

# 6. 판 시작 ➔ 점수 기록 화면에서 "고스톱 설명서"(고·배수 탭 기본 오픈) 진입 및 닫기
- tapOn: "게임시작"
- tapOn: "플레이어 1"
- tapOn: "플레이어 2"
- tapOn: "플레이어 3"
- tapOn: "완료"

- assertVisible: "점수기록"
- runFlow: ../common/assert_no_broken_text.yaml
- assertVisible: "고스톱 설명서"
- tapOn: "고스톱 설명서"

- assertVisible: "고 \\(Go\\)"
- runFlow: ../common/assert_no_broken_text.yaml

- tapOn: "Back"
- assertVisible: "점수기록"
- runFlow: ../common/assert_no_broken_text.yaml
