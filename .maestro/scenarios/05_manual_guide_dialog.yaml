appId: ${APP_ID:-zero.friends.gostopcalculator}
---
# ==========================================
# 시나리오: 고스톱 설명서(Manual) 다이얼로그 확인 및 닫기
# ==========================================

- launchApp:
    clearState: true

- tapOn: "시작하기"

# 플레이어 3명 추가
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "다음"

# 룰 설정 완료
- tapOn: "완료"

# 보드 진입 ➔ 판 시작
- tapOn: "게임시작"
- tapOn: "완료"

# 승자 선택
- tapOn: "플레이어 1"
- tapOn: "다음 \\(1/3\\)"

# 점수 기록 화면에서 "고스톱 설명서" 클릭
- assertVisible: "고스톱 설명서"
- tapOn: "고스톱 설명서"

# 설명서 전체화면 다이얼로그 노출 확인
- assertVisible: "점수 계산 법"
- assertVisible: "고스톱 설명서"

# 뒤로가기로 설명서 닫기
- back

# 점수 기록 화면으로 정상 복귀 확인
- assertVisible: "점수기록"
