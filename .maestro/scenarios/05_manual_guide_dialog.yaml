appId: zero.friends.gostopcalculator
---
# ==========================================
# 시나리오: 고스톱 설명서(Manual) 다이얼로그 확인 및 닫기
# ==========================================

- launchApp:
    clearState: true
    stopApp: true

- runFlow: ../common/wait_for_history.yaml

# 히스토리 상단 Guide 버튼 클릭 시 이용 가이드 다이얼로그 노출 및 페이지 전환/닫기 검증
- tapOn: "Guide"
- assertVisible: "다음"
- assertVisible: "Close"
- tapOn: "다음"
- assertVisible: "Back"
- tapOn: "Close"
- assertVisible: "시작하기"

- tapOn: "시작하기"

# 플레이어 3명 추가
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "다음"

# 룰 설정 (점당 100원 입력)
- assertVisible: "게임규칙.*"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn:
    id: "rule_score_input_0"
- inputText: "100"
- tapOn: "게임규칙.*"
- tapOn: "완료"

# 보드 진입 ➔ 판 시작
- tapOn: "게임시작"
- tapOn: "플레이어 1"
- tapOn: "플레이어 2"
- tapOn: "플레이어 3"
- tapOn: "완료"

# 점수 기록 화면에서 "고스톱 설명서" 클릭
- assertVisible: "점수기록"
- runFlow: ../common/assert_no_broken_text.yaml
- assertVisible: "고스톱 설명서"
- tapOn: "고스톱 설명서"

# 설명서 전체화면 다이얼로그 노출 확인
- assertVisible: "점수 계산 법"
- runFlow: ../common/assert_no_broken_text.yaml
- assertVisible: "고스톱 설명서"

# 뒤로가기로 설명서 닫기
- tapOn: "Back"

# 점수 기록 화면으로 정상 복귀 확인
- assertVisible: "점수기록"
- runFlow: ../common/assert_no_broken_text.yaml
