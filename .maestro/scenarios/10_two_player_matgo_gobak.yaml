appId: zero.friends.gostopcalculator
---
# ==========================================
# 시나리오: 2인 맞고 고박 2배(×2) 적용 및 3인 이상 독박 UI 미노출 검증
# ==========================================

- launchApp:
    clearState: true
    stopApp: true

- runFlow: ../common/wait_for_history.yaml
- tapOn: "시작하기"

# 플레이어 2명 추가 (2인 맞고)
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "다음"

# 룰 설정 (점당 100원)
- assertVisible: "게임규칙.*"
- tapOn:
    id: "rule_score_input_0"
- inputText: "100"
- tapOn: "게임규칙.*"
- tapOn: "완료"

# 판 시작 ➔ 2명 선택
- tapOn: "게임시작"
- tapOn: "플레이어 1"
- tapOn: "플레이어 2"
- tapOn: "완료"

# 점수기록 스킵
- assertVisible: "점수기록"
- tapOn: "다음 \\(1/3\\)"

# 승자 점수기록: 플레이어 1 7점
- assertVisible: "승자 점수기록"
- tapOn:
    id: "winner_point_input_0"
- inputText: "7"
- tapOn: "승자 점수기록"
- tapOn: "다음 \\(2/3\\)"

# 패자 점수기록: 2인 맞고에서 고박은 단독 x2배로 적용되며 독박/면제 배너가 뜨지 않음
- assertVisible: "패자 점수기록"
- tapOn:
    text: "고 박"
    index: 0
- assertVisible: ".*고박 \\(x2배\\).*"
- assertNotVisible: ".*고박 독박.*"
- assertNotVisible: ".*고박 면제.*"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn: "다음 \\(3/3\\)"

# 계산 확인 ➔ 점수 확정
- assertVisible: "라운드 점수를 확정할까요\\?"
- assertVisible: ".*고박 \\(x2배\\).*"
- tapOn: "점수 확정하기"

# 상세보기 검증 (+1,400원 / -1,400원)
- assertVisible: "라운드 상세보기"
- assertVisible: "고박 ×2"
- assertVisible: "\\+1,400원"
- assertVisible: "-1,400원"
- runFlow: ../common/assert_no_broken_text.yaml

# 보드 복귀
- tapOn: "Back"
- assertVisible: "1 라운드"
- runFlow: ../common/assert_no_broken_text.yaml
