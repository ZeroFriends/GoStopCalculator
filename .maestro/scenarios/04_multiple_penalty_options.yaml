appId: zero.friends.gostopcalculator
---
# ==========================================
# 시나리오: 피박 + 광박 + 첫뻑 복합 옵션 적용 시나리오
# ==========================================

- launchApp:
    clearState: true
    stopApp: true

- extendedWaitUntil:
    visible: "시작하기"
    timeout: 60000
- tapOn: "시작하기"

# 플레이어 3명 추가
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "\\+ 플레이어 추가"
- tapOn: "다음"

# 룰 설정 (점당 100원 입력)
- assertVisible: "게임규칙.*"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn:
    point: "80%,39%"
- inputText: "100"
- tapOn: "게임규칙.*"
- tapOn: "완료"

# 보드 진입 ➔ 판 시작
- tapOn: "게임시작"
- tapOn: "플레이어 1"
- tapOn: "플레이어 2"
- tapOn: "플레이어 3"
- tapOn: "완료"

# 점수 기록 단계에서 첫 뻑 선택
- assertVisible: "점수기록"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn: "첫 뻑"
- tapOn: "다음 \\(1/3\\)"

# 승자 선택 (1번 플레이어 7점)
- assertVisible: "승자 점수기록"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn:
    point: "55%,45%"
- inputText: "7"
- tapOn: "승자 점수기록"
- tapOn: "다음 \\(2/3\\)"

# 패자 기록: 피 박 + 광 박 복합 선택
- assertVisible: "패자 점수기록"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn: "피 박"
- tapOn: "광 박"
- tapOn: "다음 \\(3/3\\)"

# 계산 확인 ➔ 결과 화면에서 복합 옵션 반영 검증
- tapOn: "완료"
- assertVisible: ".*첫 뻑.*"
- assertVisible: ".*피 박.*"
- assertVisible: ".*광 박.*"
- runFlow: ../common/assert_no_broken_text.yaml
- tapOn: "Back"

# 보드 화면에 정상 반영되었는지 확인
- assertVisible: "1 라운드"
- runFlow: ../common/assert_no_broken_text.yaml
