name: Build & Deploy Signed App Bundle (.aab)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    name: Build Signed Production App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Production AAB
        run: |
          ./gradlew :app:bundleRelease --stacktrace --console=plain

      - name: Upload Signed App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GoStopCalculator-Signed-Production-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 60

      - name: Create GitHub Release & Upload AAB Asset
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
