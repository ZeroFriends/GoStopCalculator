name: Maestro E2E & i18n Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_ios:
        description: 'Run iOS Simulator E2E tests (macOS runner)'
        type: boolean
        default: true

concurrency:
  group: maestro-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-static-audit:
    name: i18n Static Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run i18n Static Resource Audit
        run: python3 .maestro/i18n_audit.py

  android-maestro-e2e:
    name: Android Maestro E2E & i18n Crawl
    needs: i18n-static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Grant Execute Permissions
        run: chmod +x gradlew .maestro/*.sh

      - name: Build Android Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --console=plain

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          echo "RUNNER_HOME=$HOME" >> "$GITHUB_ENV"

      - name: Enable KVM Group Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android Emulator & Run Maestro E2E + i18n Crawl
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./.maestro/run_android_ci.sh

      - name: Upload Android Maestro Logs & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-results
          path: |
            .maestro/logs/
            .maestro/reports/
            ${{ env.RUNNER_HOME }}/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 14

  ios-maestro-e2e:
    name: iOS Maestro E2E
    needs: i18n-static-audit
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_ios }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permissions
        run: chmod +x gradlew .maestro/*.sh

      - name: Pre-build KMP iOS Simulator Framework
        run: |
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Xss256m -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvmargs="-Xmx2500m -Xss256m -Dfile.encoding=UTF-8" \
            -Dkotlin.native.daemon.jvmargs="-Xmx3g -Xss256m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            --console=plain

      - name: Build iOS App for Simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath build/ios \
            build
          ./gradlew --stop || true

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          echo "RUNNER_HOME=$HOME" >> "$GITHUB_ENV"

      - name: Boot iOS Simulator (ko-KR) & Install App
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep -E "iPhone (17|16|15)( Pro)? " | grep -v "unavailable" | head -n 1 | grep -E -o '[0-9A-F-]{36}')
          if [[ -z "$SIM_UDID" ]]; then
            SIM_UDID=$(xcrun simctl list devices available | grep "iPhone " | grep -v "unavailable" | head -n 1 | grep -E -o '[0-9A-F-]{36}')
          fi
          if [[ -z "$SIM_UDID" ]]; then
            echo "❌ Available iPhone simulator not found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected iPhone Simulator: $SIM_UDID"

          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl spawn "$SIM_UDID" defaults write "Apple Global Domain" AppleLanguages -array "ko-KR"
          xcrun simctl spawn "$SIM_UDID" defaults write "Apple Global Domain" AppleLocale -string "ko_KR"
          xcrun simctl shutdown "$SIM_UDID"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b

          xcrun simctl install "$SIM_UDID" build/ios/Build/Products/Debug-iphonesimulator/iosApp.app

      - name: Run Maestro iOS E2E Scenarios
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: ./.maestro/run_parallel_tests.sh

      - name: Upload iOS Maestro Logs & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-results
          path: |
            .maestro/logs/
            ${{ env.RUNNER_HOME }}/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 14
