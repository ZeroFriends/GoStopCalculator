<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=430, initial-scale=1.0"/><title>08. Share Settlement Image</title><style>@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 430px; height: 932px; overflow: hidden; font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
.canvas { width: 430px; height: 932px; position: relative; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
.canvas.red-bg { background: linear-gradient(180deg, #F44336 0%, #EE3B30 60%, #E53935 100%); }
.header { width: 100%; padding: 54px 24px 0; text-align: center; color: #FFFFFF; position: relative; z-index: 5; }
.title { font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif; font-size: 38px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.15; color: #FFFFFF; text-shadow: 0 3px 10px rgba(0,0,0,0.16); margin-bottom: 16px; }
.subtitle { font-size: 18.5px; font-weight: 500; line-height: 1.48; color: rgba(255,255,255,0.97); letter-spacing: -0.02em; }
.hl-wrap { position: relative; display: inline-block; padding: 0 2px; }
.hl-wrap .star-svg { position: absolute; left: -25px; top: -10px; width: 22px; height: 22px; }
.hl-wrap .underline-svg { position: absolute; left: -4px; right: -4px; bottom: -6px; width: calc(100% + 8px); height: 10px; }
.footnote { margin-top: 10px; font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.88); }
.phone { background: #F6F7F9; border-radius: 44px 44px 0 0; padding: 12px 11px 0; box-shadow: 0 26px 60px rgba(0,0,0,0.34), 0 4px 14px rgba(0,0,0,0.18), inset 0 0 0 2px rgba(255,255,255,0.9); position: relative; overflow: hidden; }
.phone-screen { width: 100%; height: 100%; background: #FFFFFF; border-radius: 34px 34px 0 0; overflow: hidden; position: relative; display: flex; flex-direction: column; }
.status-bar { height: 28px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; color: #212121; background: #FFFFFF; flex-shrink: 0; position: relative; }
.dynamic-island { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); width: 72px; height: 16px; background: #141517; border-radius: 10px; }
.status-icons { display: flex; align-items: center; gap: 5px; font-size: 10px; }
.screen-img { width: 100%; display: block; object-fit: cover; object-position: top center; flex: 1; }
.single-stage { position: relative; width: 100%; flex: 1; display: flex; justify-content: center; padding-top: 28px; }
.single-phone { width: 336px; height: 750px; }

.share-pill { display: inline-flex; align-items: center; gap: 7px; background: #FFFFFF; color: #E53935; font-size: 13px; font-weight: 800; padding: 6px 14px; border-radius: 999px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.16); }
                    .share-pill svg { width: 16px; height: 16px; flex-shrink: 0; }
                    .share-stage { position: relative; width: 100%; flex: 1; }
                    .share-phone { position: absolute; left: 24px; top: 24px; width: 310px; height: 710px; z-index: 1; }
                    .share-ring { position: absolute; top: 34px; right: 6px; width: 52px; height: 28px; border-radius: 999px; border: 3px solid #FFE600; box-shadow: 0 0 0 5px rgba(255,230,0,0.34); z-index: 10; pointer-events: none; }
                    .share-sheet { position: absolute; right: 16px; bottom: 24px; width: 258px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 22px 48px rgba(0,0,0,0.32), 0 0 0 1px rgba(0,0,0,0.06); overflow: hidden; z-index: 4; }
                    .share-topbar { background: #F8F9FA; border-bottom: 1px solid #ECEEF2; padding: 11px 14px; display: flex; align-items: center; gap: 9px; }
                    .share-top-badge { width: 28px; height: 28px; border-radius: 9px; background: #FFF0F0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
                    .share-top-title { font-size: 11.5px; font-weight: 800; color: #191F28; line-height: 1.25; }
                    .share-top-sub { font-size: 9.5px; font-weight: 500; color: #6B7684; margin-top: 1px; }
                    .share-body { padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
                    .share-preview { width: 100%; background: #FAFAFC; border-radius: 14px; overflow: hidden; border: 1px solid #ECEEF2; }
                    .share-preview-head { background: #FFFFFF; color: #191F28; border-bottom: 1px solid #ECEEF2; font-size: 10px; font-weight: 800; padding: 7px 10px; display: flex; justify-content: space-between; }
                    .share-preview-rows { padding: 8px 10px; font-size: 10px; line-height: 1.55; color: #212121; }
                    .share-row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #F0F2F5; }
                    .share-row:last-child { border-bottom: none; }
                    .kr-red { color: #FF5252; font-weight: 700; }
                    .kr-blue { color: #1E88E5; font-weight: 700; }
                    .share-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
                    .share-act { background: #F4F5F7; border-radius: 12px; padding: 7px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
                    .share-act.primary { background: #FFF0F0; color: #E53935; }
                    .share-act-lbl { font-size: 9.5px; font-weight: 700; color: #374151; white-space: nowrap; }
                    .share-act.primary .share-act-lbl { color: #E53935; }</style></head><body><div class="canvas red-bg"><div class="header" style="padding-top:42px;">
