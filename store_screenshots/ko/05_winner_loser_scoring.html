* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 430px; height: 932px; overflow: hidden; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
.canvas { width: 430px; height: 932px; position: relative; display: flex; flex-direction: column; align-items: center; overflow: hidden; }

.header { width: 100%; padding: 58px 26px 0; text-align: center; color: #FFFFFF; position: relative; z-index: 5; }

.phone { background: #F6F7F9; border-radius: 44px 44px 0 0; padding: 12px 11px 0; box-shadow: 0 26px 60px rgba(0,0,0,0.34), 0 4px 14px rgba(0,0,0,0.18), inset 0 0 0 2px rgba(255,255,255,0.9); position: relative; overflow: hidden; }

.screen-img { width: 100%; display: block; object-fit: cover; object-position: top center; flex: 1; }
.single-stage { position: relative; width: 100%; flex: 1; display: flex; justify-content: center; padding-top: 28px; }
.single-phone { width: 336px; height: 750px; }
.dual-stage { position: relative; width: 100%; flex: 1; }
.dual-back { position: absolute; left: 26px; top: 26px; width: 294px; height: 740px; opacity: 0.88; transform: scale(0.97); z-index: 1; }

.dual-front { position: absolute; right: 22px; top: 56px; width: 306px; height: 720px; z-index: 2; }
