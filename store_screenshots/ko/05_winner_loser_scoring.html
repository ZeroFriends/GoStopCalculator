<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=430, initial-scale=1.0"/>
<title>05. 승,패 점수 기록</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 430px;
  height: 932px;
  overflow: hidden;
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.canvas {
  width: 430px;
  height: 932px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}
.canvas.red-bg {
  background: linear-gradient(180deg, #F44336 0%, #EE3B30 60%, #E53935 100%);
}
.canvas.hero-bg {
  background: linear-gradient(160deg, #2D2F36 0%, #3E4149 48%, #26282E 100%);
}
.header {
  width: 100%;
  padding: 58px 26px 0;
  text-align: center;
  color: #FFFFFF;
  position: relative;
  z-index: 5;
}
.title {
  font-family: 'Jua', 'Noto Sans KR', sans-serif;
  font-size: 46px;
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1.15;
  color: #FFFFFF;
  text-shadow: 0 3px 10px rgba(0,0,0,0.16);
  margin-bottom: 18px;
}
.subtitle {
  font-size: 21px;
  font-weight: 500;
  line-height: 1.48;
  color: rgba(255,255,255,0.97);
  letter-spacing: -0.02em;
}
.hl-wrap {
  position: relative;
  display: inline-block;
  padding: 0 2px;
}
.hl-wrap .star-svg {
  position: absolute;
  left: -26px;
  top: -10px;
  width: 24px;
  height: 24px;
}
.hl-wrap .underline-svg {
  position: absolute;
  left: -4px;
  right: -4px;
  bottom: -6px;
  width: calc(100% + 8px);
  height: 11px;
}
.footnote {
  margin-top: 10px;
  font-size: 12.5px;
  font-weight: 400;
  color: rgba(255,255,255,0.88);
  letter-spacing: -0.01em;
}

/* Modern sleek phone mockup frame */
.phone {
  background: #F6F7F9;
  border-radius: 44px 44px 0 0;
  padding: 12px 11px 0;
  box-shadow: 0 26px 60px rgba(0,0,0,0.34), 0 4px 14px rgba(0,0,0,0.18), inset 0 0 0 2px rgba(255,255,255,0.9);
  position: relative;
  overflow: hidden;
}
.phone.dark-bezel {
  background: #1A1B1E;
  box-shadow: 0 30px 65px rgba(0,0,0,0.52), 0 4px 16px rgba(0,0,0,0.3), inset 0 0 0 1.5px rgba(255,255,255,0.18);
  padding: 12px 11px 12px;
  border-radius: 46px;
}
.phone-screen {
  width: 100%;
  height: 100%;
  background: #FFFFFF;
  border-radius: 34px 34px 0 0;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}
.phone.dark-bezel .phone-screen {
  border-radius: 36px;
}
.status-bar {
  height: 28px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 700;
  color: #212121;
  background: #FFFFFF;
  flex-shrink: 0;
  position: relative;
}
.status-bar.red-sb {
  background: #FF5252;
  color: #FFFFFF;
}
.dynamic-island {
  position: absolute;
  left: 50%;
  top: 6px;
  transform: translateX(-50%);
  width: 72px;
  height: 16px;
  background: #141517;
  border-radius: 10px;
}
.status-icons {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
}
.screen-img {
  width: 100%;
  display: block;
  object-fit: cover;
  object-position: top center;
  flex: 1;
}
.single-stage {
  position: relative;
  width: 100%;
  flex: 1;
  display: flex;
  justify-content: center;
  padding-top: 28px;
}
.single-phone {
  width: 336px;
  height: 750px;
}
.dual-stage {
  position: relative;
  width: 100%;
  flex: 1;
}
.dual-back {
  position: absolute;
  left: 26px;
  top: 26px;
  width: 294px;
  height: 740px;
  opacity: 0.88;
  transform: scale(0.97);
  z-index: 1;
}
.dual-back::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(244, 67, 54, 0.12);
  border-radius: 44px 44px 0 0;
  pointer-events: none;
}
.dual-front {
  position: absolute;
  right: 22px;
  top: 56px;
  width: 306px;
  height: 720px;
  z-index: 2;
}

</style>
